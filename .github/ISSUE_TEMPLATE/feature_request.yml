name: Feature request
description: Suggest a feature, such as part of RFC 5545 this library doesn't support yet.
labels: ["enhancement", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need to do?
      description: The problem you're trying to solve, in terms of your use.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The API or behaviour you'd like. Note the RFC 5545 section, or an existing python-dateutil equivalent.
    validations:
      required: true
